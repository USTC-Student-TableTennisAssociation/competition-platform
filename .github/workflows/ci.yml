name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ustctta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ustctta_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ustctta_ci?schema=public
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/ustctta_ci?schema=public
      V2_CORE_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ustctta_ci?schema=public

      AUTH_SECRET: ci-only-auth-secret-not-for-production
      ADMIN_REAUTH_SECRET: ci-only-admin-secret-not-for-production

      APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ci-placeholder

      V2_COMPETITIONS_CREATION_MODE: V2
      CERTIFICATE_FONT_PATH: assets/fonts/NotoSansSC-Regular.ttf

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test

      - name: Validate PM2 config
        run: |
          node -e "
            const config = require('./deploy/ecosystem.config.cjs');
            if (!Array.isArray(config.apps) || config.apps.length !== 1) process.exit(1);
            if (config.apps[0].name !== 'kedapp') process.exit(1);
            if (config.apps[0].script !== 'server.js') process.exit(1);
          "

      - name: Build
        run: npm run build
