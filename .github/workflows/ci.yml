name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ustctta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ustctta_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ustctta_ci?schema=public
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/ustctta_ci?schema=public
      V2_CORE_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ustctta_ci?schema=public

      AUTH_SECRET: ci-only-auth-secret-not-for-production
      ADMIN_REAUTH_SECRET: ci-only-admin-secret-not-for-production

      APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ci-placeholder

      V2_COMPETITIONS_CREATION_MODE: V2
      CERTIFICATE_FONT_PATH: assets/fonts/NotoSansSC-Regular.ttf

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test

      - name: Validate PM2 config
        run: |
          node -e "
            const config = require('./deploy/ecosystem.config.cjs');
            if (!Array.isArray(config.apps) || config.apps.length !== 1) process.exit(1);
            if (config.apps[0].name !== 'kedapp') process.exit(1);
            if (config.apps[0].script !== 'server.js') process.exit(1);
          "

      - name: Build
        run: npm run build

      - name: Prepare production release
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          # Never ship build-machine environment files.
          rm -f .next/standalone/.env

          # Next standalone does not copy these automatically.
          rm -rf .next/standalone/public
          rm -rf .next/standalone/.next/static
          rm -rf .next/standalone/assets

          cp -R public .next/standalone/public

          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

          cp -R assets .next/standalone/assets
          cp deploy/ecosystem.config.cjs .next/standalone/ecosystem.config.cjs

          printf '%s\n' "$GITHUB_SHA" > .next/standalone/REVISION

          # Basic release integrity checks.
          test -f .next/standalone/server.js
          test -f .next/standalone/assets/fonts/NotoSansSC-Regular.ttf
          test ! -e .next/standalone/.env

          tar \
            -C .next/standalone \
            -czf "release-${GITHUB_SHA}.tar.gz" \
            .

      - name: Upload production release
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.sha }}
          path: release-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7
